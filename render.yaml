# Blueprint de Render para el backend SGP.
# Render detecta este archivo y crea el servicio automaticamente.
# Los valores marcados con sync: false se definen en el dashboard (no se versionan).
services:
  - type: web
    name: sgp-backend
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    dockerContext: ./sgp
    dockerfilePath: ./sgp/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_CORREO
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SHOW_SQL
        value: "false"
