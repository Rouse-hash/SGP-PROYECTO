spring.application.name=sgp

# Perfil por defecto para desarrollo local.
# En local se cargan los valores de application-local.properties (no versionado).
# En la nube no existe ese archivo y los valores se toman de las variables de entorno.
spring.profiles.default=local

# ============================================
# CONFIGURACIÓN DEL SERVIDOR SPRING BOOT
# ============================================

# Puerto donde se ejecutará la aplicación
server.port=8080


# ============================================
# CONFIGURACIÓN DE LA BASE DE DATOS MYSQL
# ============================================

# URL de conexión a la base de datos
# localhost = servidor local
# 3306 = puerto por defecto de MySQL
# sgp = nombre de la base de datos
# En produccion se sobreescribe con SPRING_DATASOURCE_URL
# Ejemplo: jdbc:mysql://<host>:<puerto>/<base>?sslMode=REQUIRED
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sgp}


# Usuario de MySQL
# Se puede sobreescribir con la variable de entorno DB_USERNAME
spring.datasource.username=${DB_USERNAME:root}


# Contraseña de MySQL (obligatoria, sin valor por defecto por seguridad)
# En local se define en application-local.properties; en la nube con DB_PASSWORD
spring.datasource.password=${DB_PASSWORD}


# Driver JDBC de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# CONFIGURACIÓN JPA / HIBERNATE
# ============================================

# update:
# crea tablas si no existen
# actualiza columnas sin borrar información
spring.jpa.hibernate.ddl-auto=update


# Muestra las consultas SQL en consola (solo para desarrollo)
spring.jpa.show-sql=${SHOW_SQL:false}


# Formatea las consultas SQL para que se vean organizadas
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}


# ============================================
# CONFIGURACIÓN DE CODIFICACIÓN
# ============================================

# Permite manejar caracteres especiales correctamente

spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4


# ============================================
# MENSAJES DE CONSOLA
# ============================================

# Muestra información detallada de Hibernate (solo para desarrollo)
logging.level.org.hibernate.SQL=${SHOW_SQL:OFF}

# ============================================
# CONFIGURACIÓN OPEN-IN-VIEW
# ============================================

# Evita que Hibernate mantenga abierta
# la conexión a la base de datos durante
# el proceso de renderizado de vistas.
#
# Mejora buenas prácticas de arquitectura
# y evita consultas inesperadas fuera
# de la capa de servicio.
#
# Se recomienda usar false en aplicaciones
# modernas Spring Boot.

spring.jpa.open-in-view=false

# ============================================
# CONFIGURACIÓN JWT
# ============================================

# Clave secreta para firmar los tokens (mínimo 32 caracteres, obligatoria)
# En local se define en application-local.properties; en la nube con JWT_SECRET
jwt.secret=${JWT_SECRET}

# Admin inicial creado al arrancar (opcional)
# BOOTSTRAP_ADMIN_CORREO=admin@correo.com
# BOOTSTRAP_ADMIN_PASSWORD=********

# Tiempo de expiración del token en milisegundos (24 horas)
jwt.expiration=86400000

# ============================================
# CONFIGURACIÓN DE SUBIDA DE ARCHIVOS
# ============================================

# Tamaño máximo de archivo (20 MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Directorio donde se almacenarán los archivos subidos
app.upload.dir=uploads

# ============================================
# CONFIGURACIÓN CORS
# ============================================

# Orígenes permitidos separados por comas.
# Se sobreescribe con la variable de entorno CORS_ALLOWED_ORIGINS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}